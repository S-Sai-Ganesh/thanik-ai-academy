name: Build Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android command-line tools and build tools
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            --output "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" "$ANDROID_SDK_ROOT/bin"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.1.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generate release signing key
        run: |
          mkdir -p release-signing
          SIGNING_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$SIGNING_PASSWORD" > release-signing/password.txt
          keytool -genkeypair -v \
            -keystore release-signing/thanik-ai-upload.jks \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias thanik-ai \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Thanik AI Academy, OU=Mobile, O=S-Sai-Ganesh, C=IN"

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest twa/twa-manifest.json --directory twa

      - name: Build signed APK and App Bundle
        run: |
          SIGNING_PASSWORD="$(cat release-signing/password.txt)"
          cd twa
          chmod +x gradlew
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$SIGNING_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$SIGNING_PASSWORD"
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json --signingKeyPath ../release-signing/thanik-ai-upload.jks

      - name: Upload Play Store release files
        uses: actions/upload-artifact@v4
        with:
          name: thanik-ai-play-store-release
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab

      - name: Upload signing-key backup
        uses: actions/upload-artifact@v4
        with:
          name: thanik-ai-signing-key-backup
          path: |
            release-signing/thanik-ai-upload.jks
            release-signing/password.txt
          retention-days: 90

      - name: Create Android asset links
        run: |
          SIGNING_PASSWORD="$(cat release-signing/password.txt)"
          FINGERPRINT="$(keytool -list -v -keystore release-signing/thanik-ai-upload.jks -alias thanik-ai -storepass "$SIGNING_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}')"
          mkdir -p .well-known
          cat > .well-known/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.ssaiganesh.thanikaiacademy",
              "sha256_cert_fingerprints": ["$FINGERPRINT"]
            }
          }]
          EOF

      - name: Publish Android asset links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json
          git commit -m "Add Android asset links" || exit 0
          git pull --rebase origin main || true
          git push || true
